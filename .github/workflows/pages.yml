name: Publish website to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'dist/**'
      - 'tests/**'
      - 'drafts/legal/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Set up Node.js for checks
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Check JavaScript and site integrity
        run: |
          node --check dist/script.js
          node --check dist/contact-validation.js
          node --check dist/legal-navigation.js
          node --test tests/contact-validation.test.cjs tests/site-integrity.test.cjs
      - name: Configure Pages
        uses: actions/configure-pages@v6
      - name: Upload static website
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v5
